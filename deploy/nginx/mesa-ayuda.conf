# Mesa de Ayuda UTS - Nginx
# Destino en el servidor: /etc/nginx/conf.d/mesa-ayuda.conf
#   /api/*, /sanctum/*, /up  -> Laravel (PHP-FPM); los headers de seguridad los pone Laravel (SecurityHeaders)
#   /storage/*               -> 404 (los adjuntos solo se descargan por la API con token)
#   todo lo demas            -> Next.js (next start en 127.0.0.1:3000)

upstream mesa_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 18.225.227.5;

    server_tokens off;
    client_max_body_size 20M;

    root /var/www/mesa-ayuda/backend/public;
    index index.php;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php-fpm/mesa-ayuda.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://mesa_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://mesa_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
