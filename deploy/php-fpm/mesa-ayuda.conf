; Mesa de Ayuda UTS - pool de PHP-FPM
; Destino en el servidor: /etc/php-fpm.d/mesa-ayuda.conf
[mesa-ayuda]
user = nginx
group = nginx

listen = /run/php-fpm/mesa-ayuda.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; t3.small (2 GB RAM): pocos procesos para dejar memoria a Next.js y PostgreSQL
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php-fpm/mesa-ayuda-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
